# =====================================================================
# Static hosting for the built SPA.
#
# WATCH OUT: nginx add_header does NOT merge across levels. A location
# block declaring ANY add_header discards every header inherited from
# the server block — so the security headers are repeated in each
# location that adds one of its own. Verified with curl -I; without the
# repetition they vanish silently on exactly the paths that matter.
# =====================================================================

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Applies to any location that declares no add_header of its own.
    add_header X-Content-Type-Options "nosniff" always;   # no MIME sniffing
    add_header X-Frame-Options        "DENY" always;      # clickjacking, T-SPA-06
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Do not advertise the exact nginx version to an attacker.
    server_tokens off;

    # SPA routing: unknown paths return index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so cache them hard.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or a deploy never reaches anyone.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-store" always;
    }
}
